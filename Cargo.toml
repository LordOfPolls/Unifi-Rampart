[package]
name = "unifi-rampart"
version = "0.1.0"
edition = "2024"

[dependencies]
mongodb = "2.8"  # pinned due to Unifi's mongo version
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
futures-util = "0.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
config = "0.14"
regex = "1.12.2"
ipnetwork = "0.20"
once_cell = "1.21.3"

[dev-dependencies]
tempfile = "3.8"
pretty_assertions = "1.4"